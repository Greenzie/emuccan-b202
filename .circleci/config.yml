version: 2.1

orbs:
  greenzie: greenzie/build_and_publish_debs@0.4.0

parameters:
  manual_deploy:
    description: "Trigger a manual deploy to greenzie-experimental and greenzie-public-experimental."
    type: boolean
    default: false

workflows:
  version: 2
  pushbuild:
    when:
      not: << pipeline.parameters.manual_deploy >>
    jobs:
      - greenzie/debian_build_dkms:
          name: "debian_dkms_build"
          context: GREENZIE

  manualdeploy:
    when: << pipeline.parameters.manual_deploy >>
    jobs:
      - greenzie/debian_build_dkms:
          name: "debian_dkms_build"
          context: GREENZIE
      # Dual deploy (legacy combined + public tier) until mowers stop using
      # the legacy combined channel. TODO(sc-52271): drop the legacy deploy.
      - greenzie/debian_deploy_experimental_ssh:
          name: "deploy_to_legacy_experimental"
          context: GREENZIE
          requires:
            - debian_dkms_build
      - greenzie/debian_deploy_experimental_ssh:
          name: "deploy_to_public_experimental"
          context: GREENZIE
          repo_name: experimental-greenzie-public-focal-main
          channel: greenzie-public-experimental
          requires:
            - debian_dkms_build
